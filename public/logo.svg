<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256">
  <style>
    /* Light mode: white background, dark shapes */
    @media (prefers-color-scheme: light) {
      rect.background { fill: #fff; }
      path { fill: #111; }
    }
    /* Dark mode: black background, white shapes */
    @media (prefers-color-scheme: dark) {
      rect.background { fill: #000; }
      path { fill: #fff; }
    }
  </style>

  <!-- background rectangle -->
  <rect class="background" width="512" height="256" />

  <!-- your shapes -->
  <path d="
      M192 256H64v-64h128v64Z
      M64 192H0V64h64v128Z
      M192 64H64V0h128v64Z
      M192 192H128v-64h64v64Z
      M320 192h-64V0h64v192Z
      M448 192h-64V0h64v192Z
      M384 256H320v-64h64v64Z
  " />
</svg>
